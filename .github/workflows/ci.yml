name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # sh evita depender del permiso de ejecución de mvnw (se pierde al hacer commit desde Windows)
      - name: Compilar y ejecutar las pruebas
        run: sh ./mvnw -B verify
