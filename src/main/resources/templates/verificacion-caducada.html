<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enlace no disponible · ErasmusNest</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        .aviso { border: 2px solid #8a5a00; background: #fff8e5; padding: .75rem 1rem; margin-bottom: 1.5rem; }
        .ok { border: 2px solid #1b6e2a; background: #eefaf0; padding: .75rem 1rem; margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: .25rem; }
        input { width: 100%; padding: .5rem; font-size: 1rem; border: 2px solid #555; border-radius: 4px; box-sizing: border-box; margin-bottom: 1rem; }
        input:focus, button:focus, a:focus { outline: 3px solid #1d4ed8; outline-offset: 2px; }
        button { padding: .6rem 1.2rem; font-size: 1rem; background: #1d4ed8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1 th:text="${aviso}">El enlace ha caducado</h1>
    <div class="aviso" role="alert">
        <p>Los enlaces de verificación caducan a las 24 horas y solo se pueden usar una vez. Si tu cuenta sigue pendiente, pide un enlace nuevo: solo valdrá el último.</p>
    </div>
    <form th:action="@{/verificacion/reenviar}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <button type="submit">Enviar un nuevo enlace</button>
    </form>
    <p><a th:href="@{/}">Volver al inicio</a></p>
</main>
</body>
</html>
