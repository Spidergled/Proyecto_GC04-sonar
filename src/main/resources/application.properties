spring.application.name=erasmusnest

# Base de datos H2 embebida en fichero (DEC-024). Solo datos sintéticos (DEC-009).
spring.datasource.url=jdbc:h2:file:./data/erasmusnest
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Textos de la interfaz en messages*.properties (preparado para US-024)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Español por defecto; inglés si el navegador lo pide
spring.web.locale=es
spring.messages.fallback-to-system-locale=false
